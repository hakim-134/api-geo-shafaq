openapi: 3.0.3
info:
  title: Shafaq Geo API
  version: 1.0.0
  description: |
    The contract between the game (geo-shafaq) and the server (api-geo-shafaq).
    Change this file first, then regenerate both sides: `make gen` here, `npm run gen` in
    geo-shafaq.

    Sessions are an HttpOnly cookie. Every write is JSON (`Content-Type: application/json`),
    which, with the origin check, is the CSRF protection.
servers:
  - url: https://api.geo.shafaq.uz
  - url: http://localhost:8131

tags:
  - name: system
  - name: session
  - name: accounts
  - name: maps
  - name: games

paths:
  /v1/health:
    get:
      tags: [system]
      operationId: getHealth
      summary: The process is up.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /v1/ready:
    get:
      tags: [system]
      operationId: getReady
      summary: The database and Valkey answer.
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503":
          description: Not ready
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /v1/session:
    post:
      tags: [session]
      operationId: startSession
      summary: Returns the current player, creating a guest on the first visit.
      description: |
        Safe to call on every page load. With a valid session cookie it returns that player;
        without one it creates a guest (an emoji name like `🐼_42`) and sets the cookie.
      responses:
        "200":
          description: The player
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }

  /v1/me:
    get:
      tags: [session]
      operationId: getMe
      responses:
        "200":
          description: The player
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Error" }

  /v1/me/games:
    get:
      tags: [games]
      operationId: listMyGames
      summary: The player's finished games, newest first.
      parameters:
        - name: before
          in: query
          description: Cursor; the `next` value of the previous page.
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: A page of games
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GamePage" }
        "401": { $ref: "#/components/responses/Error" }

  /v1/config:
    get:
      tags: [accounts]
      operationId: getConfig
      summary: What the game needs to know before it draws the sign-in buttons and the avatar picker.
      responses:
        "200":
          description: The settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppConfig" }

  /v1/auth/telegram/start:
    post:
      tags: [accounts]
      operationId: startTelegramLogin
      summary: Starts "sign in with Telegram" through the bot.
      description: |
        The game opens `url` (the bot, with `start=login_<code>`); the player presses Start in
        Telegram; the game then calls `/v1/auth/telegram/check` with the code until it is done.
        The code is good for 10 minutes and only for the session that asked for it.
      responses:
        "200":
          description: The code and the bot link
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TelegramStart" }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }

  /v1/auth/telegram/check:
    post:
      tags: [accounts]
      operationId: checkTelegramLogin
      summary: Collects a Telegram sign-in once the player pressed Start in the bot.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
      responses:
        "200":
          description: "`pending` until the player pressed Start; then the sign-in's outcome"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResult" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/auth/telegram/webapp:
    post:
      tags: [accounts]
      operationId: telegramWebAppLogin
      summary: Signs in inside Telegram (the game opened as a Mini App), with Telegram's signed initData.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [initData]
              properties:
                initData: { type: string }
      responses:
        "200":
          description: The sign-in's outcome
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }

  /v1/auth/google:
    post:
      tags: [accounts]
      operationId: googleLogin
      summary: Signs in with Google (the ID token from Google's sign-in button).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [credential]
              properties:
                credential: { type: string, description: Google's ID token (a JWT). }
      responses:
        "200":
          description: The sign-in's outcome
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResult" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }

  /v1/auth/merge:
    post:
      tags: [accounts]
      operationId: mergeAccounts
      summary: Says yes to a merge offer; the other account moves into this one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "200":
          description: The player, now with everything of both
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/auth/logout:
    post:
      tags: [accounts]
      operationId: logout
      summary: Signs out this device, or every device. The next visit starts as a new guest.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                everywhere: { type: boolean }
      responses:
        "204": { description: Signed out }

  /v1/me/profile:
    get:
      tags: [accounts]
      operationId: getMyProfile
      responses:
        "200":
          description: The player's own profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        "401": { $ref: "#/components/responses/Error" }
    post:
      tags: [accounts]
      operationId: updateProfile
      summary: Changes the player's name or avatar.
      description: |
        Names are 2–24 characters (letters, digits, spaces, `_ - .`) and pass the name filter
        (uz/ru/en); `bad_name` otherwise. The avatar is one of `AppConfig.avatars`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfileUpdate" }
      responses:
        "200":
          description: The player
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }

  /v1/me/identities/unlink:
    post:
      tags: [accounts]
      operationId: unlinkIdentity
      summary: Removes a way to sign in. The last one stays (`last_identity`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: string, description: "`Identity.id`" }
      responses:
        "200":
          description: The player
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /v1/users/{userId}:
    get:
      tags: [accounts]
      operationId: getProfile
      summary: A player's public profile.
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: The profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/users/{userId}/report:
    post:
      tags: [accounts]
      operationId: reportUser
      summary: Reports a player to the admins (a rude name, cheating, other).
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, enum: [name, cheating, other] }
      responses:
        "204": { description: Reported }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }

  /v1/maps:
    get:
      tags: [maps]
      operationId: listMaps
      summary: The maps on the menu.
      responses:
        "200":
          description: Maps
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MapSummary" }

  /v1/maps/{slug}:
    get:
      tags: [maps]
      operationId: getMap
      parameters:
        - $ref: "#/components/parameters/Slug"
      responses:
        "200":
          description: The map
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MapSummary" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/places/{slug}/shape:
    get:
      tags: [maps]
      operationId: getPlaceShape
      summary: A place's simplified boundary as GeoJSON, for the guess map.
      parameters:
        - $ref: "#/components/parameters/Slug"
      responses:
        "200":
          description: The shape
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaceShape" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/games:
    post:
      tags: [games]
      operationId: createGame
      summary: Starts a solo game on a map.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateGame" }
      responses:
        "201":
          description: The new game, before its first round
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Game" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }

  /v1/games/{gameId}:
    get:
      tags: [games]
      operationId: getGame
      summary: A game with every finished round. Also used to resume after a reload.
      parameters:
        - $ref: "#/components/parameters/GameId"
      responses:
        "200":
          description: The game
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Game" }
        "404": { $ref: "#/components/responses/Error" }

  /v1/games/{gameId}/rounds:
    post:
      tags: [games]
      operationId: nextRound
      summary: Starts the next round. The server picks the panorama.
      description: |
        Returns the round that is already running, if there is one, so a reload or a double
        tap does not skip a round.
      parameters:
        - $ref: "#/components/parameters/GameId"
      responses:
        "200":
          description: The round
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Round" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }

  /v1/games/{gameId}/rounds/{n}/shown:
    post:
      tags: [games]
      operationId: roundShown
      summary: The panorama is on screen; the round's clock starts now.
      description: |
        For providers that search near a point (Yandex), `pos` is the panorama the viewer
        actually opened. It must be close to the point the server chose; the round is then
        scored against it. A second call returns the round unchanged.
      parameters:
        - $ref: "#/components/parameters/GameId"
        - $ref: "#/components/parameters/RoundN"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoundShown" }
      responses:
        "200":
          description: The round, with its deadline
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Round" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /v1/games/{gameId}/rounds/{n}/fail:
    post:
      tags: [games]
      operationId: roundFailed
      summary: The viewer could not open this panorama; the server picks another for the same round.
      description: |
        Only before the round is shown, at most 5 times a round. `not_found` (the provider
        has no panorama there any more) counts against the panorama; after 3 it is retired.
      parameters:
        - $ref: "#/components/parameters/GameId"
        - $ref: "#/components/parameters/RoundN"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoundFailed" }
      responses:
        "200":
          description: The round with a new panorama
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Round" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }

  /v1/games/{gameId}/rounds/{n}/hint:
    post:
      tags: [games]
      operationId: useHint
      summary: Spends one hint of this round.
      parameters:
        - $ref: "#/components/parameters/GameId"
        - $ref: "#/components/parameters/RoundN"
      responses:
        "200":
          description: The hint
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Hint" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /v1/games/{gameId}/rounds/{n}/guess:
    post:
      tags: [games]
      operationId: guess
      summary: Ends the round with a guess (or none), scored by the server.
      parameters:
        - $ref: "#/components/parameters/GameId"
        - $ref: "#/components/parameters/RoundN"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GuessRequest" }
      responses:
        "200":
          description: The round's result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoundResult" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /v1/pano/demo/{ref}:
    get:
      tags: [games]
      operationId: getDemoPanorama
      summary: The drawn test panorama of the `demo` provider (a JPEG).
      parameters:
        - name: ref
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: An equirectangular JPEG image
          content:
            image/jpeg:
              schema: { type: string }
        "404": { $ref: "#/components/responses/Error" }

components:
  parameters:
    Slug:
      name: slug
      in: path
      required: true
      schema: { type: string }
    GameId:
      name: gameId
      in: path
      required: true
      schema: { type: string, format: uuid }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RoundN:
      name: "n"
      in: path
      required: true
      schema: { type: integer, minimum: 1 }

  responses:
    Error:
      description: An error. `code` is stable and the game translates it.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [code]
      properties:
        code:
          type: string
          description: |
            no_session | not_found | bad_input | wrong_phase | round_running | game_over |
            no_panorama | daily_cap | too_far | rate_limited | banned | bad_name |
            last_identity | bad_login | not_configured | internal.
            banned: the player is banned and cannot start games.
            daily_cap: the game's panorama providers reached today's budget (`DAILY_CAPS`);
            new games start again after midnight, Moscow time.
        message: { type: string }

    Health:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
        version: { type: string }
        checks:
          type: object
          additionalProperties: { type: string }

    Text:
      description: A name in the three languages. `ru` and `en` fall back to `uz` (street signs are in Uzbek Latin).
      type: object
      required: [uz, ru, en]
      properties:
        uz: { type: string }
        ru: { type: string }
        en: { type: string }

    LatLon:
      type: object
      required: [lat, lon]
      properties:
        lat: { type: number, format: double, minimum: -90, maximum: 90 }
        lon: { type: number, format: double, minimum: -180, maximum: 180 }

    User:
      type: object
      required: [id, name, avatar, guest]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: "🐼_42" }
        avatar: { type: string, description: "An emoji from the curated list", example: "🐼" }
        guest: { type: boolean, description: No way to sign in yet; everything is kept on the server all the same. }
        banned: { type: boolean }

    Stats:
      type: object
      required: [games, best, avgRound]
      properties:
        games: { type: integer }
        best: { type: integer }
        avgRound: { type: integer }

    Me:
      type: object
      required: [user, stats, identities]
      properties:
        user: { $ref: "#/components/schemas/User" }
        stats: { $ref: "#/components/schemas/Stats" }
        identities:
          type: array
          items: { $ref: "#/components/schemas/Identity" }

    Identity:
      description: A way to sign in.
      type: object
      required: [id, provider, name, username, createdAt]
      properties:
        id: { type: string, description: Opaque; for unlinking. }
        provider: { type: string, enum: [telegram, google] }
        name: { type: string, description: The name the provider shows. }
        username: { type: string, description: "@username (Telegram) or the e-mail address (Google)." }
        createdAt: { type: string, format: date-time }

    AppConfig:
      type: object
      required: [avatars]
      properties:
        telegramBot:
          type: string
          description: The bot's username; absent = no Telegram sign-in on this server.
        googleClientId:
          type: string
          description: For Google's sign-in button; absent = no Google sign-in on this server.
        avatars:
          type: array
          description: The emojis a player may pick.
          items: { type: string }

    TelegramStart:
      type: object
      required: [code, url, expiresIn]
      properties:
        code: { type: string }
        url: { type: string, description: "https://t.me/<bot>?start=login_<code>" }
        expiresIn: { type: integer, description: Seconds. }

    AuthResult:
      description: |
        signed_in: this device is now that account (a guest's games moved into it).
        linked: the identity was added to the current player.
        already: it was already this player's.
        merge: it belongs to another account; `merge` asks the player to join the two.
        pending: (Telegram bot) the player has not pressed Start yet.
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [signed_in, linked, already, merge, pending] }
        me: { $ref: "#/components/schemas/Me" }
        merge: { $ref: "#/components/schemas/MergeOffer" }

    MergeOffer:
      type: object
      required: [token, other]
      properties:
        token: { type: string, description: For `/v1/auth/merge`; good for 10 minutes. }
        other: { $ref: "#/components/schemas/Profile" }

    PublicUser:
      type: object
      required: [id, name, avatar, guest, joinedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        avatar: { type: string }
        guest: { type: boolean }
        banned: { type: boolean }
        joinedAt: { type: string, format: date-time }

    ProfileStats:
      type: object
      required: [games, rounds, best, avgRound, perfect, km]
      properties:
        games: { type: integer }
        rounds: { type: integer }
        best: { type: integer }
        avgRound: { type: integer }
        perfect: { type: integer, description: Rounds scored 4 900 or more. }
        km: { type: number, format: double, description: All guesses' distances added up. }

    StreetProgress:
      type: object
      required: [seen, learned, total]
      properties:
        seen: { type: integer, description: Streets been on. }
        learned: { type: integer, description: Streets guessed within 500 m at least once. }
        total: { type: integer, description: Streets in the game. }

    MapBest:
      type: object
      required: [map, games, best, rounds, gameId]
      properties:
        map: { $ref: "#/components/schemas/MapRef" }
        games: { type: integer }
        best: { type: integer, description: Total of the best game (best per round). }
        rounds: { type: integer, description: Rounds of that game. }
        gameId: { type: string, format: uuid }

    Profile:
      type: object
      required: [user, stats, streets, maps, recent]
      properties:
        user: { $ref: "#/components/schemas/PublicUser" }
        stats: { $ref: "#/components/schemas/ProfileStats" }
        streets: { $ref: "#/components/schemas/StreetProgress" }
        maps:
          type: array
          items: { $ref: "#/components/schemas/MapBest" }
        recent:
          type: array
          description: The last finished games, newest first.
          items: { $ref: "#/components/schemas/GameListItem" }

    ProfileUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 64 }
        avatar: { type: string }

    Movement:
      type: string
      enum: [move, nomove, nmpz]
      description: move = walk freely; nomove = look around only; nmpz = no move, no pan, no zoom.

    HintRule:
      type: object
      required: [count, per, cost]
      properties:
        count:
          type: integer
          minimum: 0
          maximum: 20
          description: How many hints; 0 = no Hint button.
        per:
          type: string
          enum: [game, round]
        cost:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: Share of the round score each hint takes (0.2 = −20%).

    Rules:
      description: One set of rules for solo games, rooms and challenges.
      type: object
      required: [rounds, timeSec, movement, hints, compass, providers, scoreScale, panoLabels, mapLabels]
      properties:
        rounds: { type: integer, minimum: 1, maximum: 20 }
        timeSec:
          type: integer
          minimum: 0
          maximum: 600
          description: Seconds per round; 0 = no limit, otherwise at least 10.
        movement: { $ref: "#/components/schemas/Movement" }
        hints: { $ref: "#/components/schemas/HintRule" }
        compass: { type: boolean }
        providers:
          type: array
          description: >-
            Allowed panorama providers; empty = the players' providers (PROVIDERS) that cover the
            place. Test providers (TEST_PROVIDERS, e.g. demo) play only when named here.
          items: { type: string }
        scoreScale:
          type: number
          format: double
          minimum: 0.25
          maximum: 4
          description: Stretches the map's scoring distance; 2 = forgiving, 0.6 = strict.
        panoLabels:
          type: boolean
          description: House numbers and place labels inside the panorama.
        mapLabels:
          type: boolean
          description: City and metro names on the guess map.

    MapSummary:
      type: object
      required: [slug, name, description, official, panoramas, groups, bbox, sizeKm, rules, providers]
      properties:
        slug: { type: string, example: tashkent-streets }
        name: { $ref: "#/components/schemas/Text" }
        description: { $ref: "#/components/schemas/Text" }
        official: { type: boolean }
        panoramas: { type: integer, description: "Active panoramas in the map, on the players' providers." }
        groups:
          type: integer
          description: Streets (on a street map) or places the panoramas are grouped by.
        streets:
          type: boolean
          description: A street map; `groups` counts streets, and progress counts streets seen.
        seen:
          type: integer
          description: Streets this player has already been on (street maps only).
        bbox:
          type: array
          description: "[west, south, east, north]"
          minItems: 4
          maxItems: 4
          items: { type: number, format: double }
        sizeKm: { type: number, format: double, description: The map's size D for scoring. }
        rules: { $ref: "#/components/schemas/Rules" }
        providers:
          type: array
          description: >-
            The players' providers with panoramas in this map. Test providers are never listed
            and never counted in `panoramas` or `groups`.
          items: { type: string }
        outline:
          type: string
          description: The place's outline as a small SVG (maps of one place only).

    PlaceShape:
      type: object
      required: [slug, geometry, outline]
      properties:
        slug: { type: string }
        geometry:
          type: object
          description: GeoJSON (Multi)Polygon, simplified.
          additionalProperties: true
        outline: { type: string, description: The same shape as a small SVG. }

    CreateGame:
      type: object
      required: [map]
      properties:
        map: { type: string, description: The map's slug. }
        rules: { $ref: "#/components/schemas/Rules" }

    GameStatus:
      type: string
      enum: [playing, finished, abandoned]

    Game:
      type: object
      required: [id, map, rules, status, startedAt, total, max, rounds, player]
      properties:
        id: { type: string, format: uuid }
        player: { $ref: "#/components/schemas/PublicUser" }
        map: { $ref: "#/components/schemas/MapSummary" }
        rules: { $ref: "#/components/schemas/Rules" }
        status: { $ref: "#/components/schemas/GameStatus" }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        total: { type: integer }
        max: { type: integer }
        hintsLeft:
          type: integer
          description: Hints left in the game (per-game hint rules only).
        rounds:
          type: array
          description: Every round so far; the last one may still be running.
          items: { $ref: "#/components/schemas/Round" }

    GamePage:
      type: object
      required: [games]
      properties:
        games:
          type: array
          items: { $ref: "#/components/schemas/GameListItem" }
        next: { type: string }

    GameListItem:
      type: object
      required: [id, map, status, startedAt, total, max, rounds]
      properties:
        id: { type: string, format: uuid }
        map: { $ref: "#/components/schemas/MapRef" }
        status: { $ref: "#/components/schemas/GameStatus" }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        total: { type: integer }
        max: { type: integer }
        rounds: { type: integer }

    MapRef:
      type: object
      required: [slug, name]
      properties:
        slug: { type: string }
        name: { $ref: "#/components/schemas/Text" }

    Round:
      type: object
      required: [n, view, hintsUsed, hintsLeft]
      properties:
        "n": { type: integer }
        view: { $ref: "#/components/schemas/PanoView" }
        shownAt: { type: string, format: date-time }
        deadline:
          type: string
          format: date-time
          description: When the round ends; absent without a time limit or before it is shown.
        remainingMs:
          type: integer
          description: Milliseconds left at the moment of the answer, so the clock does not depend on the phone's time.
        hintsUsed: { type: integer }
        hintsLeft: { type: integer }
        hints:
          type: array
          items: { $ref: "#/components/schemas/Hint" }
        result: { $ref: "#/components/schemas/RoundResult" }

    PanoView:
      description: What the browser's viewer needs for this round, and nothing more.
      type: object
      required: [provider]
      properties:
        provider: { type: string, example: yandex }
        near:
          $ref: "#/components/schemas/LatLon"
        snapKm:
          type: number
          format: double
          description: With `near`, how far the opened panorama may be from it.
        ref:
          type: string
          description: The provider's panorama id, or an opaque reference (demo, own imagery).
        imageUrl:
          type: string
          description: An image the viewer can open directly (demo, own imagery).
        heading:
          type: number
          format: double
          description: Where to look first, degrees from north.
        guessMap:
          type: string
          example: yandex
          description: |
            The map this round must be guessed on, because the provider's terms forbid its
            panoramas next to another map (Yandex: only on Yandex's map; Google: only on
            Google's). Absent: any map, the game's usual one.

    RoundShown:
      type: object
      properties:
        pos:
          $ref: "#/components/schemas/LatLon"

    RoundFailed:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          enum: [not_found, error]

    GuessRequest:
      type: object
      properties:
        pos:
          $ref: "#/components/schemas/LatLon"

    Hint:
      type: object
      required: [kind, text, circle]
      properties:
        kind:
          type: string
          enum: [district, region]
        text:
          $ref: "#/components/schemas/Text"
        circle:
          $ref: "#/components/schemas/Circle"

    Circle:
      type: object
      required: [center, radiusKm]
      properties:
        center: { $ref: "#/components/schemas/LatLon" }
        radiusKm: { type: number, format: double }

    RoundResult:
      type: object
      required: [actual, score, hintsUsed, late, place]
      properties:
        actual: { $ref: "#/components/schemas/LatLon" }
        guess: { $ref: "#/components/schemas/LatLon" }
        km: { type: number, format: double }
        score: { type: integer }
        hintsUsed: { type: integer }
        late:
          type: boolean
          description: The guess came after the deadline and scored 0.
        place: { $ref: "#/components/schemas/PlaceInfo" }
        gameOver: { type: boolean, description: This was the last round. }
        total: { type: integer, description: The game's total after this round. }

    PlaceInfo:
      description: '"You were here": what the round teaches.'
      type: object
      properties:
        street: { $ref: "#/components/schemas/Text" }
        district: { $ref: "#/components/schemas/Text" }
        city: { $ref: "#/components/schemas/Text" }
        region: { $ref: "#/components/schemas/Text" }
        metro:
          $ref: "#/components/schemas/Metro"

    Metro:
      type: object
      required: [name, km]
      properties:
        name: { $ref: "#/components/schemas/Text" }
        km: { type: number, format: double }

# Prometheus on the server: the API's and the worker's /metrics (private ports, never public).
global:
  scrape_interval: 15s
  evaluation_interval: 30s

scrape_configs:
  - job_name: api
    static_configs: [{ targets: ["api:9131"] }]
  - job_name: worker
    static_configs: [{ targets: ["worker:9132"] }]
  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]

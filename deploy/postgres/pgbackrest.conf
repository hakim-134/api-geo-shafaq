# pgBackRest for the stanza "shafaq". The repository is set by PGBACKREST_REPO1_* variables
# (docker-compose.yml): S3-compatible storage off the server in production, a local volume
# when none is configured. Every option here can be overridden the same way.
[global]
repo1-path=/shafaq
repo1-retention-full=4
start-fast=y
compress-type=zst
log-level-console=info
log-level-file=off
process-max=2

[shafaq]
pg1-path=/var/lib/postgresql/data
pg1-socket-path=/var/run/postgresql
pg1-user=shafaq
